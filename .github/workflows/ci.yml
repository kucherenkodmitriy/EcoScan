name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  AWS_REGION: eu-central-1
  TERRAFORM_VERSION: "1.5.0"

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  # ============================================
  # CHANGE DETECTION
  # ============================================
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      frontend: ${{ steps.filter.outputs.frontend }}
      foundation: ${{ steps.filter.outputs.foundation }}
      data: ${{ steps.filter.outputs.data }}
      compute: ${{ steps.filter.outputs.compute }}
      api: ${{ steps.filter.outputs.api }}
      frontend_infra: ${{ steps.filter.outputs.frontend_infra }}
      tfvars: ${{ steps.filter.outputs.tfvars }}
      any_infra: ${{ steps.filter.outputs.any_infra }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect file changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'services/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            frontend:
              - 'frontend/**'
            foundation:
              - 'infrastructure/layers/00-foundation/**'
            data:
              - 'infrastructure/layers/01-data/**'
            compute:
              - 'infrastructure/layers/02-compute/**'
            api:
              - 'infrastructure/layers/03-api/**'
            frontend_infra:
              - 'infrastructure/layers/04-frontend/**'
            tfvars:
              - 'infrastructure/environments/**'
              - 'infrastructure/backend/**'
            any_infra:
              - 'infrastructure/**'

      - name: Print detected changes
        run: |
          echo "Rust code changed: ${{ steps.filter.outputs.rust }}"
          echo "Frontend changed: ${{ steps.filter.outputs.frontend }}"
          echo "Foundation layer changed: ${{ steps.filter.outputs.foundation }}"
          echo "Data layer changed: ${{ steps.filter.outputs.data }}"
          echo "Compute layer changed: ${{ steps.filter.outputs.compute }}"
          echo "API layer changed: ${{ steps.filter.outputs.api }}"
          echo "Frontend infra changed: ${{ steps.filter.outputs.frontend_infra }}"
          echo "TFVars changed: ${{ steps.filter.outputs.tfvars }}"
          echo "Any infra changed: ${{ steps.filter.outputs.any_infra }}"

  # ============================================
  # RUST LINT & TEST (runs if Rust code changed)
  # ============================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            services/target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-lint-
            ${{ runner.os }}-cargo-

      - name: Check formatting
        working-directory: services
        run: cargo fmt -- --check

      - name: Run clippy
        working-directory: services
        run: cargo clippy -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            services/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
            ${{ runner.os }}-cargo-

      - name: Run unit tests
        working-directory: services
        run: cargo test --lib --verbose

  # ============================================
  # BUILD LAMBDA (only if Rust code changed)
  # ============================================
  build-lambda:
    name: Build Lambda
    runs-on: ubuntu-latest
    needs: [detect-changes, lint, test]
    if: |
      always() &&
      needs.detect-changes.outputs.rust == 'true' &&
      (needs.lint.result == 'success' || needs.lint.result == 'skipped') &&
      (needs.test.result == 'success' || needs.test.result == 'skipped')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Lambda function
        run: |
          chmod +x ./scripts/build-lambda.sh
          ./scripts/build-lambda.sh x86_64

      - name: Verify build artifacts
        run: |
          echo "=== Build artifacts ==="
          ls -lh services/target/*.zip
          echo ""
          echo "=== lambda.zip (bin-status-reporter) ==="
          unzip -l services/target/lambda.zip
          echo ""
          echo "=== authorizer.zip (lambda-authorizer) ==="
          unzip -l services/target/authorizer.zip
          echo ""
          echo "=== admin-dashboard.zip (admin-dashboard-api) ==="
          unzip -l services/target/admin-dashboard.zip

      - name: Upload Lambda artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lambda-packages
          path: services/target/*.zip
          retention-days: 1

  # ============================================
  # UPLOAD LAMBDA TO S3 (for Terraform to use)
  # ============================================
  upload-lambda-s3:
    name: Upload Lambda to S3
    runs-on: ubuntu-latest
    needs: [detect-changes, build-lambda]
    if: |
      always() &&
      needs.build-lambda.result == 'success' &&
      github.ref == 'refs/heads/dev'
    steps:
      - uses: actions/checkout@v4

      - name: Download Lambda artifacts
        uses: actions/download-artifact@v4
        with:
          name: lambda-packages
          path: services/target/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-UploadLambda

      - name: Upload Lambda artifacts to S3
        run: |
          # Upload bin-status-reporter
          HASH=$(sha256sum services/target/lambda.zip | cut -d' ' -f1)
          aws s3 cp services/target/lambda.zip \
            s3://ecoscan-terraform-state-dev/lambda-artifacts/lambda-${HASH}.zip
          aws s3 cp services/target/lambda.zip \
            s3://ecoscan-terraform-state-dev/lambda-artifacts/lambda-latest.zip

          # Upload lambda-authorizer
          HASH=$(sha256sum services/target/authorizer.zip | cut -d' ' -f1)
          aws s3 cp services/target/authorizer.zip \
            s3://ecoscan-terraform-state-dev/lambda-artifacts/authorizer-${HASH}.zip
          aws s3 cp services/target/authorizer.zip \
            s3://ecoscan-terraform-state-dev/lambda-artifacts/authorizer-latest.zip

          # Upload admin-dashboard-api
          HASH=$(sha256sum services/target/admin-dashboard.zip | cut -d' ' -f1)
          aws s3 cp services/target/admin-dashboard.zip \
            s3://ecoscan-terraform-state-dev/lambda-artifacts/admin-dashboard-${HASH}.zip
          aws s3 cp services/target/admin-dashboard.zip \
            s3://ecoscan-terraform-state-dev/lambda-artifacts/admin-dashboard-latest.zip

  # ============================================
  # TERRAFORM VALIDATION (runs if any infra changed)
  # ============================================
  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.any_infra == 'true'
    strategy:
      matrix:
        layer: [00-foundation, 01-data, 02-compute, 03-api, 04-frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init
        working-directory: infrastructure/layers/${{ matrix.layer }}
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: infrastructure/layers/${{ matrix.layer }}
        run: terraform validate

      - name: Terraform Format Check
        working-directory: infrastructure/layers/${{ matrix.layer }}
        run: terraform fmt -check -recursive

  # ============================================
  # DEPLOY FOUNDATION LAYER
  # ============================================
  deploy-foundation:
    name: Deploy Foundation
    runs-on: ubuntu-latest
    needs: [detect-changes, terraform-validate]
    if: |
      always() &&
      github.ref == 'refs/heads/dev' &&
      (needs.terraform-validate.result == 'success' || needs.terraform-validate.result == 'skipped') &&
      (needs.detect-changes.outputs.foundation == 'true' || needs.detect-changes.outputs.tfvars == 'true')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-DeployFoundation

      - name: Terraform Init
        working-directory: infrastructure/layers/00-foundation
        run: |
          terraform init \
            -backend-config="../../../infrastructure/backend/dev.tfbackend" \
            -backend-config="key=layers/00-foundation/terraform.tfstate"

      - name: Terraform Plan
        working-directory: infrastructure/layers/00-foundation
        run: terraform plan -var-file="../../environments/dev.tfvars" -out=tfplan

      - name: Terraform Apply
        working-directory: infrastructure/layers/00-foundation
        run: terraform apply -auto-approve tfplan

  # ============================================
  # DEPLOY DATA LAYER
  # ============================================
  deploy-data:
    name: Deploy Data
    runs-on: ubuntu-latest
    needs: [detect-changes, terraform-validate, deploy-foundation]
    if: |
      always() &&
      github.ref == 'refs/heads/dev' &&
      (needs.terraform-validate.result == 'success' || needs.terraform-validate.result == 'skipped') &&
      (needs.deploy-foundation.result == 'success' || needs.deploy-foundation.result == 'skipped') &&
      (needs.detect-changes.outputs.data == 'true' || needs.detect-changes.outputs.tfvars == 'true')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-DeployData

      - name: Terraform Init
        working-directory: infrastructure/layers/01-data
        run: |
          terraform init \
            -backend-config="../../../infrastructure/backend/dev.tfbackend" \
            -backend-config="key=layers/01-data/terraform.tfstate"

      - name: Terraform Plan
        working-directory: infrastructure/layers/01-data
        run: terraform plan -var-file="../../environments/dev.tfvars" -out=tfplan

      - name: Terraform Apply
        working-directory: infrastructure/layers/01-data
        run: terraform apply -auto-approve tfplan

  # ============================================
  # DEPLOY API LAYER (SQS must exist before compute)
  # ============================================
  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    needs: [detect-changes, terraform-validate, deploy-data]
    if: |
      always() &&
      github.ref == 'refs/heads/dev' &&
      (needs.terraform-validate.result == 'success' || needs.terraform-validate.result == 'skipped') &&
      (needs.deploy-data.result == 'success' || needs.deploy-data.result == 'skipped') &&
      (needs.detect-changes.outputs.api == 'true' || needs.detect-changes.outputs.tfvars == 'true')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-DeployAPI

      - name: Terraform Init
        working-directory: infrastructure/layers/03-api
        run: |
          terraform init \
            -backend-config="../../../infrastructure/backend/dev.tfbackend" \
            -backend-config="key=layers/03-api/terraform.tfstate"

      - name: Terraform Plan
        working-directory: infrastructure/layers/03-api
        run: terraform plan -var-file="../../environments/dev.tfvars" -out=tfplan

      - name: Terraform Apply
        working-directory: infrastructure/layers/03-api
        run: terraform apply -auto-approve tfplan

  # ============================================
  # DEPLOY COMPUTE LAYER (requires Lambda artifact)
  # ============================================
  deploy-compute:
    name: Deploy Compute
    runs-on: ubuntu-latest
    needs: [detect-changes, terraform-validate, deploy-api, build-lambda, upload-lambda-s3]
    if: |
      always() &&
      github.ref == 'refs/heads/dev' &&
      (needs.terraform-validate.result == 'success' || needs.terraform-validate.result == 'skipped') &&
      (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped') &&
      (needs.detect-changes.outputs.compute == 'true' || needs.detect-changes.outputs.tfvars == 'true' || needs.detect-changes.outputs.rust == 'true')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-DeployCompute

      # Download Lambda artifacts if they were built in this run
      - name: Download Lambda artifacts
        if: needs.build-lambda.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: lambda-packages
          path: services/target/

      # If Lambda wasn't built, download from S3
      - name: Download Lambda artifacts from S3
        if: needs.build-lambda.result != 'success'
        run: |
          mkdir -p services/target
          aws s3 cp s3://ecoscan-terraform-state-dev/lambda-artifacts/lambda-latest.zip \
            services/target/lambda.zip
          aws s3 cp s3://ecoscan-terraform-state-dev/lambda-artifacts/authorizer-latest.zip \
            services/target/authorizer.zip
          aws s3 cp s3://ecoscan-terraform-state-dev/lambda-artifacts/admin-dashboard-latest.zip \
            services/target/admin-dashboard.zip

      - name: Verify Lambda artifacts
        run: |
          echo "=== Lambda artifacts ==="
          ls -la services/target/
          echo ""
          echo "Verifying all required artifacts exist..."
          [ -f services/target/lambda.zip ] && echo "  - lambda.zip: OK" || echo "  - lambda.zip: MISSING"
          [ -f services/target/authorizer.zip ] && echo "  - authorizer.zip: OK" || echo "  - authorizer.zip: MISSING"
          [ -f services/target/admin-dashboard.zip ] && echo "  - admin-dashboard.zip: OK" || echo "  - admin-dashboard.zip: MISSING"

      - name: Terraform Init
        working-directory: infrastructure/layers/02-compute
        run: |
          terraform init \
            -backend-config="../../../infrastructure/backend/dev.tfbackend" \
            -backend-config="key=layers/02-compute/terraform.tfstate"

      - name: Terraform Plan
        working-directory: infrastructure/layers/02-compute
        run: terraform plan -var-file="../../environments/dev.tfvars" -out=tfplan

      - name: Terraform Apply
        working-directory: infrastructure/layers/02-compute
        run: terraform apply -auto-approve tfplan

  # ============================================
  # BUILD FRONTEND (React SPA)
  # ============================================
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: |
      needs.detect-changes.outputs.frontend == 'true' ||
      needs.detect-changes.outputs.frontend_infra == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist
          retention-days: 1

  # ============================================
  # DEPLOY FRONTEND (CloudFront + S3)
  # ============================================
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: [detect-changes, terraform-validate, deploy-api, build-frontend]
    if: |
      always() &&
      github.ref == 'refs/heads/dev' &&
      (needs.terraform-validate.result == 'success' || needs.terraform-validate.result == 'skipped') &&
      (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped') &&
      (needs.build-frontend.result == 'success') &&
      (needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.frontend_infra == 'true' || needs.detect-changes.outputs.tfvars == 'true')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-DeployFrontend

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist

      - name: Terraform Init
        working-directory: infrastructure/layers/04-frontend
        run: |
          terraform init \
            -backend-config="../../../infrastructure/backend/dev.tfbackend" \
            -backend-config="key=layers/04-frontend/terraform.tfstate"

      - name: Terraform Plan
        working-directory: infrastructure/layers/04-frontend
        run: terraform plan -var-file="../../environments/dev.tfvars" -out=tfplan

      - name: Terraform Apply
        working-directory: infrastructure/layers/04-frontend
        run: terraform apply -auto-approve tfplan

      - name: Get S3 bucket and CloudFront ID
        id: infra-outputs
        working-directory: infrastructure/layers/04-frontend
        run: |
          echo "FRONTEND_BUCKET=$(terraform output -raw frontend_bucket_name)" >> $GITHUB_OUTPUT
          echo "CLOUDFRONT_ID=$(terraform output -raw cloudfront_distribution_id)" >> $GITHUB_OUTPUT
          echo "FRONTEND_URL=$(terraform output -raw frontend_url)" >> $GITHUB_OUTPUT

      - name: Upload to S3
        run: |
          aws s3 sync frontend/dist/ s3://${{ steps.infra-outputs.outputs.FRONTEND_BUCKET }}/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html" \
            --exclude "*.json"

          # Upload index.html and JSON files with shorter cache
          aws s3 cp frontend/dist/index.html s3://${{ steps.infra-outputs.outputs.FRONTEND_BUCKET }}/index.html \
            --cache-control "public, max-age=0, must-revalidate"

          # Upload any JSON files (like manifest.json)
          find frontend/dist -name "*.json" -exec aws s3 cp {} s3://${{ steps.infra-outputs.outputs.FRONTEND_BUCKET }}/ \
            --cache-control "public, max-age=0, must-revalidate" \;

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.infra-outputs.outputs.CLOUDFRONT_ID }} \
            --paths "/*"

      - name: Frontend Deployment Summary
        run: |
          echo "## Frontend Deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** ${{ steps.infra-outputs.outputs.FRONTEND_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "CloudFront cache invalidation in progress." >> $GITHUB_STEP_SUMMARY

  # ============================================
  # SMOKE TESTS & E2E TESTS ON AWS
  # ============================================
  smoke-tests:
    name: Smoke Tests (AWS)
    runs-on: ubuntu-latest
    needs: [detect-changes, deploy-compute, deploy-api, deploy-data]
    if: |
      always() &&
      github.ref == 'refs/heads/dev' &&
      (needs.deploy-compute.result == 'success' || needs.deploy-compute.result == 'skipped') &&
      (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped') &&
      (needs.deploy-data.result == 'success' || needs.deploy-data.result == 'skipped')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-SmokeTests

      - name: Initialize Terraform (for outputs)
        working-directory: infrastructure/layers/03-api
        run: |
          terraform init \
            -backend-config="../../backend/dev.tfbackend" \
            -backend-config="key=layers/03-api/terraform.tfstate"

      - name: Run Smoke Tests
        run: |
          chmod +x scripts/smoke-test.sh
          ./scripts/smoke-test.sh dev

      - name: Smoke Test Results
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "## ✅ Smoke Tests Passed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "All smoke tests completed successfully on AWS dev environment." >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ Smoke Tests Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "One or more smoke tests failed. Check logs for details." >> $GITHUB_STEP_SUMMARY
          fi

  e2e-tests-aws:
    name: E2E Tests (AWS)
    runs-on: ubuntu-latest
    needs: [detect-changes, smoke-tests]
    if: |
      always() &&
      github.ref == 'refs/heads/dev' &&
      needs.smoke-tests.result == 'success' &&
      (needs.detect-changes.outputs.rust == 'true' || needs.detect-changes.outputs.any_infra == 'true')
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            services/target
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-e2e-
            ${{ runner.os }}-cargo-

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-E2ETests

      - name: Initialize Terraform (for outputs)
        working-directory: infrastructure/layers/03-api
        run: |
          terraform init \
            -backend-config="../../backend/dev.tfbackend" \
            -backend-config="key=layers/03-api/terraform.tfstate"

      - name: Get API Endpoint
        id: api-endpoint
        working-directory: infrastructure/layers/03-api
        run: |
          API_ENDPOINT=$(terraform output -raw api_gateway_invoke_url)
          echo "API_ENDPOINT=$API_ENDPOINT" >> $GITHUB_ENV
          echo "endpoint=$API_ENDPOINT" >> $GITHUB_OUTPUT

      - name: Run E2E Tests
        working-directory: services/e2e-tests
        env:
          API_ENDPOINT: ${{ env.API_ENDPOINT }}
          ENVIRONMENT: dev
        run: |
          echo "Running E2E tests against: $API_ENDPOINT"
          cargo test --release -- --nocapture

      - name: E2E Test Results
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "## ✅ E2E Tests Passed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "All end-to-end tests completed successfully against AWS dev environment." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**API Endpoint:** ${{ steps.api-endpoint.outputs.endpoint }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ E2E Tests Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "One or more E2E tests failed. Check logs for details." >> $GITHUB_STEP_SUMMARY
          fi

  # ============================================
  # DEPLOYMENT SUMMARY
  # ============================================
  deployment-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [detect-changes, lint, test, build-lambda, build-frontend, deploy-foundation, deploy-data, deploy-api, deploy-compute, deploy-frontend, smoke-tests, e2e-tests-aws]
    if: always() && github.ref == 'refs/heads/dev'
    steps:
      - name: Summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Changed | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Rust Code | ${{ needs.detect-changes.outputs.rust }} | Lint: ${{ needs.lint.result }}, Test: ${{ needs.test.result }}, Build: ${{ needs.build-lambda.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | ${{ needs.detect-changes.outputs.frontend }} | Build: ${{ needs.build-frontend.result }}, Deploy: ${{ needs.deploy-frontend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Foundation | ${{ needs.detect-changes.outputs.foundation }} | ${{ needs.deploy-foundation.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Data | ${{ needs.detect-changes.outputs.data }} | ${{ needs.deploy-data.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| API | ${{ needs.detect-changes.outputs.api }} | ${{ needs.deploy-api.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Compute | ${{ needs.detect-changes.outputs.compute }} | ${{ needs.deploy-compute.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Smoke Tests** | - | ${{ needs.smoke-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **E2E Tests (AWS)** | - | ${{ needs.e2e-tests-aws.result }} |" >> $GITHUB_STEP_SUMMARY
