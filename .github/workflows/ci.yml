name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  AWS_REGION: eu-central-1
  TERRAFORM_VERSION: "1.5.0"

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  # ============================================
  # CHANGE DETECTION
  # ============================================
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      foundation: ${{ steps.filter.outputs.foundation }}
      data: ${{ steps.filter.outputs.data }}
      compute: ${{ steps.filter.outputs.compute }}
      api: ${{ steps.filter.outputs.api }}
      tfvars: ${{ steps.filter.outputs.tfvars }}
      any_infra: ${{ steps.filter.outputs.any_infra }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect file changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'services/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            foundation:
              - 'infrastructure/layers/00-foundation/**'
            data:
              - 'infrastructure/layers/01-data/**'
            compute:
              - 'infrastructure/layers/02-compute/**'
            api:
              - 'infrastructure/layers/03-api/**'
            tfvars:
              - 'infrastructure/environments/**'
              - 'infrastructure/backend/**'
            any_infra:
              - 'infrastructure/**'

      - name: Print detected changes
        run: |
          echo "Rust code changed: ${{ steps.filter.outputs.rust }}"
          echo "Foundation layer changed: ${{ steps.filter.outputs.foundation }}"
          echo "Data layer changed: ${{ steps.filter.outputs.data }}"
          echo "Compute layer changed: ${{ steps.filter.outputs.compute }}"
          echo "API layer changed: ${{ steps.filter.outputs.api }}"
          echo "TFVars changed: ${{ steps.filter.outputs.tfvars }}"
          echo "Any infra changed: ${{ steps.filter.outputs.any_infra }}"

  # ============================================
  # RUST LINT & TEST (runs if Rust code changed)
  # ============================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            services/target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-lint-
            ${{ runner.os }}-cargo-

      - name: Check formatting
        working-directory: services
        run: cargo fmt -- --check

      - name: Run clippy
        working-directory: services
        run: cargo clippy -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            services/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
            ${{ runner.os }}-cargo-

      - name: Run unit tests
        working-directory: services
        run: cargo test --lib --verbose

  # ============================================
  # BUILD LAMBDA (only if Rust code changed)
  # ============================================
  build-lambda:
    name: Build Lambda
    runs-on: ubuntu-latest
    needs: [detect-changes, lint, test]
    if: |
      always() &&
      needs.detect-changes.outputs.rust == 'true' &&
      (needs.lint.result == 'success' || needs.lint.result == 'skipped') &&
      (needs.test.result == 'success' || needs.test.result == 'skipped')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Lambda function
        run: |
          chmod +x ./scripts/build-lambda.sh
          ./scripts/build-lambda.sh x86_64

      - name: Verify build artifact
        run: |
          ls -lh services/target/lambda.zip
          unzip -l services/target/lambda.zip

      - name: Upload Lambda artifact
        uses: actions/upload-artifact@v4
        with:
          name: lambda-package
          path: services/target/lambda.zip
          retention-days: 1

  # ============================================
  # UPLOAD LAMBDA TO S3 (for Terraform to use)
  # ============================================
  upload-lambda-s3:
    name: Upload Lambda to S3
    runs-on: ubuntu-latest
    needs: [detect-changes, build-lambda]
    if: |
      always() &&
      needs.build-lambda.result == 'success' &&
      github.ref == 'refs/heads/dev'
    steps:
      - uses: actions/checkout@v4

      - name: Download Lambda artifact
        uses: actions/download-artifact@v4
        with:
          name: lambda-package
          path: services/target/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-UploadLambda

      - name: Upload Lambda to S3
        run: |
          HASH=$(sha256sum services/target/lambda.zip | cut -d' ' -f1)
          aws s3 cp services/target/lambda.zip \
            s3://ecoscan-terraform-state-dev/lambda-artifacts/lambda-${HASH}.zip
          # Also upload as latest for easy reference
          aws s3 cp services/target/lambda.zip \
            s3://ecoscan-terraform-state-dev/lambda-artifacts/lambda-latest.zip

  # ============================================
  # TERRAFORM VALIDATION (runs if any infra changed)
  # ============================================
  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.any_infra == 'true'
    strategy:
      matrix:
        layer: [00-foundation, 01-data, 02-compute, 03-api]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init
        working-directory: infrastructure/layers/${{ matrix.layer }}
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: infrastructure/layers/${{ matrix.layer }}
        run: terraform validate

      - name: Terraform Format Check
        working-directory: infrastructure/layers/${{ matrix.layer }}
        run: terraform fmt -check -recursive

  # ============================================
  # DEPLOY FOUNDATION LAYER
  # ============================================
  deploy-foundation:
    name: Deploy Foundation
    runs-on: ubuntu-latest
    needs: [detect-changes, terraform-validate]
    if: |
      always() &&
      github.ref == 'refs/heads/dev' &&
      (needs.terraform-validate.result == 'success' || needs.terraform-validate.result == 'skipped') &&
      (needs.detect-changes.outputs.foundation == 'true' || needs.detect-changes.outputs.tfvars == 'true')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-DeployFoundation

      - name: Terraform Init
        working-directory: infrastructure/layers/00-foundation
        run: |
          terraform init \
            -backend-config="../../../infrastructure/backend/dev.tfbackend" \
            -backend-config="key=layers/00-foundation/terraform.tfstate"

      - name: Terraform Plan
        working-directory: infrastructure/layers/00-foundation
        run: terraform plan -var-file="../../environments/dev.tfvars" -out=tfplan

      - name: Terraform Apply
        working-directory: infrastructure/layers/00-foundation
        run: terraform apply -auto-approve tfplan

  # ============================================
  # DEPLOY DATA LAYER
  # ============================================
  deploy-data:
    name: Deploy Data
    runs-on: ubuntu-latest
    needs: [detect-changes, terraform-validate, deploy-foundation]
    if: |
      always() &&
      github.ref == 'refs/heads/dev' &&
      (needs.terraform-validate.result == 'success' || needs.terraform-validate.result == 'skipped') &&
      (needs.deploy-foundation.result == 'success' || needs.deploy-foundation.result == 'skipped') &&
      (needs.detect-changes.outputs.data == 'true' || needs.detect-changes.outputs.tfvars == 'true')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-DeployData

      - name: Terraform Init
        working-directory: infrastructure/layers/01-data
        run: |
          terraform init \
            -backend-config="../../../infrastructure/backend/dev.tfbackend" \
            -backend-config="key=layers/01-data/terraform.tfstate"

      - name: Terraform Plan
        working-directory: infrastructure/layers/01-data
        run: terraform plan -var-file="../../environments/dev.tfvars" -out=tfplan

      - name: Terraform Apply
        working-directory: infrastructure/layers/01-data
        run: terraform apply -auto-approve tfplan

  # ============================================
  # DEPLOY API LAYER (SQS must exist before compute)
  # ============================================
  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    needs: [detect-changes, terraform-validate, deploy-data]
    if: |
      always() &&
      github.ref == 'refs/heads/dev' &&
      (needs.terraform-validate.result == 'success' || needs.terraform-validate.result == 'skipped') &&
      (needs.deploy-data.result == 'success' || needs.deploy-data.result == 'skipped') &&
      (needs.detect-changes.outputs.api == 'true' || needs.detect-changes.outputs.tfvars == 'true')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-DeployAPI

      - name: Terraform Init
        working-directory: infrastructure/layers/03-api
        run: |
          terraform init \
            -backend-config="../../../infrastructure/backend/dev.tfbackend" \
            -backend-config="key=layers/03-api/terraform.tfstate"

      - name: Terraform Plan
        working-directory: infrastructure/layers/03-api
        run: terraform plan -var-file="../../environments/dev.tfvars" -out=tfplan

      - name: Terraform Apply
        working-directory: infrastructure/layers/03-api
        run: terraform apply -auto-approve tfplan

  # ============================================
  # DEPLOY COMPUTE LAYER (requires Lambda artifact)
  # ============================================
  deploy-compute:
    name: Deploy Compute
    runs-on: ubuntu-latest
    needs: [detect-changes, terraform-validate, deploy-api, build-lambda, upload-lambda-s3]
    if: |
      always() &&
      github.ref == 'refs/heads/dev' &&
      (needs.terraform-validate.result == 'success' || needs.terraform-validate.result == 'skipped') &&
      (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped') &&
      (needs.detect-changes.outputs.compute == 'true' || needs.detect-changes.outputs.tfvars == 'true' || needs.detect-changes.outputs.rust == 'true')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-DeployCompute

      # Download Lambda artifact if it was built in this run
      - name: Download Lambda artifact
        if: needs.build-lambda.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: lambda-package
          path: services/target/

      # If Lambda wasn't built, download from S3
      - name: Download Lambda from S3
        if: needs.build-lambda.result != 'success'
        run: |
          mkdir -p services/target
          aws s3 cp s3://ecoscan-terraform-state-dev/lambda-artifacts/lambda-latest.zip \
            services/target/lambda.zip

      - name: Terraform Init
        working-directory: infrastructure/layers/02-compute
        run: |
          terraform init \
            -backend-config="../../../infrastructure/backend/dev.tfbackend" \
            -backend-config="key=layers/02-compute/terraform.tfstate"

      - name: Terraform Plan
        working-directory: infrastructure/layers/02-compute
        run: terraform plan -var-file="../../environments/dev.tfvars" -out=tfplan

      - name: Terraform Apply
        working-directory: infrastructure/layers/02-compute
        run: terraform apply -auto-approve tfplan

  # ============================================
  # DEPLOYMENT SUMMARY
  # ============================================
  deployment-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [detect-changes, lint, test, build-lambda, deploy-foundation, deploy-data, deploy-api, deploy-compute]
    if: always() && github.ref == 'refs/heads/dev'
    steps:
      - name: Summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Changed | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Rust Code | ${{ needs.detect-changes.outputs.rust }} | Lint: ${{ needs.lint.result }}, Test: ${{ needs.test.result }}, Build: ${{ needs.build-lambda.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Foundation | ${{ needs.detect-changes.outputs.foundation }} | ${{ needs.deploy-foundation.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Data | ${{ needs.detect-changes.outputs.data }} | ${{ needs.deploy-data.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| API | ${{ needs.detect-changes.outputs.api }} | ${{ needs.deploy-api.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Compute | ${{ needs.detect-changes.outputs.compute }} | ${{ needs.deploy-compute.result }} |" >> $GITHUB_STEP_SUMMARY
