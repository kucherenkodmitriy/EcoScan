name: Frontend E2E Tests

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run tests on'
        required: false
        default: 'dev'
        type: string

concurrency:
  group: e2e-frontend-${{ github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: "1.5.0"

jobs:
  e2e-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    services:
      localstack:
        image: localstack/localstack:latest
        ports:
          - 4566:4566
        env:
          SERVICES: dynamodb,sqs,secretsmanager,apigateway,lambda,iam,s3,sts,logs
          DEFAULT_REGION: eu-central-1
          DOCKER_HOST: unix:///var/run/docker.sock
        options: >-
          --health-cmd "curl -f http://localhost:4566/_localstack/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            services/.cargo-cache
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-e2e-
            ${{ runner.os }}-cargo-

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Lambda functions
        run: |
          chmod +x ./scripts/build-lambda.sh
          ./scripts/build-lambda.sh x86_64

      - name: Deploy LocalStack infrastructure
        run: |
          chmod +x ./infrastructure/scripts/init-environment.sh
          ./infrastructure/scripts/init-environment.sh local

      - name: Seed test data
        run: |
          chmod +x ./scripts/seed-data.sh
          ./scripts/seed-data.sh local

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        working-directory: frontend
        run: npx playwright test --project=chromium
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Test Results Summary
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "## Playwright E2E Tests Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "## Playwright E2E Tests Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Download the **playwright-report** artifact for details." >> $GITHUB_STEP_SUMMARY
          fi
