AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: "EcoScan Backend\nThis template deploys the backend infrastructure for\
  \ the EcoScan project.\n"
Parameters:
  Environment:
    Type: String
    Default: dev
    Description: The deployment environment (e.g., dev, prod).
  RateLimit:
    Type: Number
    Default: 10
    Description: The rate limit for the API Gateway.
  BurstLimit:
    Type: Number
    Default: 5
    Description: The burst limit for the API Gateway.
Resources:
  StatusUpdateFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${Environment}-EcoScanUpdateBinStatus
      Description: A Lambda function that updates the status of a trash bin.
      CodeUri: s3://local-lambda-deployments/dde363127df8e5fb487c4aee5ce84935
      Handler: bootstrap
      Runtime: provided.al2
      Architectures:
      - x86_64
      Timeout: 30
      MemorySize: 128
      Environment:
        Variables:
          TRASH_BINS_TABLE_NAME:
            Ref: TrashBinsTable
          STATUS_REPORTS_TABLE_NAME:
            Ref: StatusReportsTable
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: TrashBinsTable
      - DynamoDBCrudPolicy:
          TableName:
            Ref: StatusReportsTable
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /bins/{binId}/status
            Method: post
  LocationTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    Properties:
      TableName:
        Fn::Sub: ${Environment}-ecoscan-location
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: LocationId
        AttributeType: S
      KeySchema:
      - AttributeName: LocationId
        KeyType: HASH
  TrashBinsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    Properties:
      TableName:
        Fn::Sub: ${Environment}-ecoscan-bin-status
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: BinId
        AttributeType: S
      KeySchema:
      - AttributeName: BinId
        KeyType: HASH
  QRCodeTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    Properties:
      TableName:
        Fn::Sub: ${Environment}-ecoscan-qrcode
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: QRCodeId
        AttributeType: S
      KeySchema:
      - AttributeName: QRCodeId
        KeyType: HASH
  StatusReportsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    Properties:
      TableName:
        Fn::Sub: ${Environment}-ecoscan-bin-status-reports
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: BinId
        AttributeType: S
      - AttributeName: CreatedAt
        AttributeType: S
      KeySchema:
      - AttributeName: BinId
        KeyType: HASH
      - AttributeName: CreatedAt
        KeyType: RANGE
Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value:
      Fn::Sub: http://${ServerlessRestApi}.execute-api.localhost.localstack.cloud:4566/Prod
  StatusUpdateFunctionArn:
    Description: ARN of the Status Update Lambda function
    Value:
      Fn::GetAtt:
      - StatusUpdateFunction
      - Arn
    Export:
      Name:
        Fn::Sub: ${Environment}-EcoScan-StatusUpdateFunctionArn
  LocationTableName:
    Description: Name of the location table
    Value:
      Ref: LocationTable
  TrashBinsTableName:
    Description: Name of the trash bins table
    Value:
      Ref: TrashBinsTable
  QRCodeTableName:
    Description: Name of the QR code table
    Value:
      Ref: QRCodeTable
  StatusReportsTableName:
    Description: Name of the status reports table
    Value:
      Ref: StatusReportsTable
