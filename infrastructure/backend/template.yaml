AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: EcoScan Backend Resources

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Environment name

  # We'll keep these parameters in case they're referenced elsewhere
  RateLimit:
    Type: Number
    Default: 10
    Description: Number of requests per second allowed (not currently used)

  BurstLimit:
    Type: Number
    Default: 5
    Description: Maximum number of requests allowed in burst (not currently used)

Resources:

  StatusUpdateFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: services/bin-status-reporter/target/lambda.zip
      Handler: bootstrap
      Runtime: provided.al2
      Architectures:
        - x86_64
      MemorySize: 256
      Timeout: 30
      Environment:
        Variables:
          TRASH_BINS_TABLE: !Ref TrashBinsTable
          STATUS_REPORTS_TABLE: !Ref StatusReportsTable
          LOG_LEVEL: INFO
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TrashBinsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref StatusReportsTable

  LocationTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${Environment}-ecoscan-location"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: LocationId
          AttributeType: S
      KeySchema:
        - AttributeName: LocationId
          KeyType: HASH

  TrashBinsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${Environment}-ecoscan-bin-status"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: BinId
          AttributeType: S
      KeySchema:
        - AttributeName: BinId
          KeyType: HASH

  QRCodeTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${Environment}-ecoscan-qrcode"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: QRCodeId
          AttributeType: S
      KeySchema:
        - AttributeName: QRCodeId
          KeyType: HASH

  StatusReportsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${Environment}-ecoscan-bin-status-reports"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: BinId
          AttributeType: S
        - AttributeName: CreatedAt
          AttributeType: S
      KeySchema:
        - AttributeName: BinId
          KeyType: HASH
        - AttributeName: CreatedAt
          KeyType: RANGE

Outputs:
  StatusUpdateFunctionArn:
    Description: ARN of the Status Update Lambda function
    Value: !GetAtt StatusUpdateFunction.Arn
    Export:
      Name: !Sub "${Environment}-EcoScan-StatusUpdateFunctionArn"

  LocationTableName:
    Description: Name of the location table
    Value: !Ref LocationTable

  TrashBinsTableName:
    Description: Name of the trash bins table
    Value: !Ref TrashBinsTable

  QRCodeTableName:
    Description: Name of the QR code table
    Value: !Ref QRCodeTable

  StatusReportsTableName:
    Description: Name of the status reports table
    Value: !Ref StatusReportsTable