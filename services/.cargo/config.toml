# Cargo configuration for the EcoScan workspace.

# Ensures that the native linker is used when building for Apple Silicon,
# which can resolve potential linking issues.
[target.aarch64-apple-darwin]
linker = "clang"

# Specifies the linker for the static Linux build, which is required for AWS Lambda.
[target.x86_64-unknown-linux-musl]
linker = "musl-gcc"

[env]
# Environment variables for local testing with LocalStack
AWS_ACCESS_KEY_ID = "test"
AWS_SECRET_ACCESS_KEY = "test"
AWS_DEFAULT_REGION = "eu-central-1"
TRASH_BINS_TABLE = "dev-ecoscan-trash-bins"
STATUS_REPORTS_TABLE = "dev-ecoscan-status-reports"
