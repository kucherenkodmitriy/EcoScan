<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoScan Admin - Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #1a5d1a 0%, #2e7d32 100%);
            color: white;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .user-info {
            font-size: 14px;
            opacity: 0.9;
        }

        .user-info strong {
            display: block;
            font-size: 15px;
            opacity: 1;
        }

        .btn-logout {
            padding: 8px 16px;
            background: rgba(255,255,255,0.15);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-logout:hover {
            background: rgba(255,255,255,0.25);
        }

        /* Main content */
        .main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
        }

        /* Stats bar */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .stat-card h3 {
            font-size: 13px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .stat-card .value {
            font-size: 32px;
            font-weight: 700;
            color: #333;
        }

        .stat-card.critical .value { color: #c62828; }
        .stat-card.warning .value { color: #f57c00; }
        .stat-card.good .value { color: #2e7d32; }

        /* Bins section */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .section-header h2 {
            font-size: 20px;
            color: #333;
        }

        .btn-refresh {
            padding: 8px 16px;
            background: #2e7d32;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-refresh:hover {
            background: #1b5e20;
        }

        .btn-refresh:disabled {
            background: #a5d6a7;
            cursor: not-allowed;
        }

        /* Table */
        .bins-table {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 14px 16px;
            text-align: left;
        }

        th {
            background: #fafafa;
            font-size: 12px;
            font-weight: 600;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #eee;
        }

        td {
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
            color: #333;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover {
            background: #fafafa;
        }

        /* Status indicator */
        .status-bar {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-bar .bar {
            flex: 1;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            max-width: 100px;
        }

        .status-bar .bar-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.3s;
        }

        .status-bar .percent {
            font-weight: 600;
            min-width: 45px;
        }

        .status-bar.low .bar-fill { background: #4caf50; }
        .status-bar.low .percent { color: #2e7d32; }

        .status-bar.medium .bar-fill { background: #ff9800; }
        .status-bar.medium .percent { color: #f57c00; }

        .status-bar.high .bar-fill { background: #f44336; }
        .status-bar.high .percent { color: #c62828; }

        /* Bin type badge */
        .bin-type {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }

        .bin-type.general { background: #e0e0e0; color: #424242; }
        .bin-type.recycling { background: #e3f2fd; color: #1565c0; }
        .bin-type.organic { background: #e8f5e9; color: #2e7d32; }
        .bin-type.hazardous { background: #fff3e0; color: #e65100; }

        /* Active badge */
        .active-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }

        .active-badge.active { background: #e8f5e9; color: #2e7d32; }
        .active-badge.inactive { background: #ffebee; color: #c62828; }

        /* Loading & Empty states */
        .loading-state, .empty-state, .error-state {
            text-align: center;
            padding: 60px 20px;
        }

        .loading-state p, .empty-state p {
            color: #666;
            font-size: 16px;
        }

        .error-state {
            color: #c62828;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #e0e0e0;
            border-top-color: #2e7d32;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 12px;
                text-align: center;
            }

            .header-right {
                width: 100%;
                justify-content: center;
            }

            .main {
                padding: 16px;
            }

            .bins-table {
                overflow-x: auto;
            }

            table {
                min-width: 600px;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-left">
            <h1>EcoScan</h1>
        </div>
        <div class="header-right">
            <div class="user-info" id="userInfo">
                <strong>Loading...</strong>
            </div>
            <button class="btn-logout" onclick="logout()">Logout</button>
        </div>
    </header>

    <main class="main">
        <div class="stats-bar" id="statsBar">
            <div class="stat-card">
                <h3>Total Bins</h3>
                <div class="value" id="totalBins">-</div>
            </div>
            <div class="stat-card critical">
                <h3>Full (80%+)</h3>
                <div class="value" id="fullBins">-</div>
            </div>
            <div class="stat-card warning">
                <h3>Filling (50-79%)</h3>
                <div class="value" id="fillingBins">-</div>
            </div>
            <div class="stat-card good">
                <h3>Available (&lt;50%)</h3>
                <div class="value" id="availableBins">-</div>
            </div>
        </div>

        <div class="section-header">
            <h2>Bins</h2>
            <button class="btn-refresh" id="refreshBtn" onclick="loadBins()">Refresh</button>
        </div>

        <div class="bins-table">
            <div id="tableContent">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>Loading bins...</p>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Handle both direct API Gateway and LocalStack URL structures
        const API_BASE = window.location.href.replace(/\/static\/dashboard\.html.*$/, '');

        // Check authentication
        function checkAuth() {
            const token = localStorage.getItem('ecoscan_token');
            if (!token) {
                window.location.href = './login.html';
                return null;
            }
            return token;
        }

        // Get auth headers
        function getAuthHeaders() {
            const token = checkAuth();
            return {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            };
        }

        // Logout
        function logout() {
            localStorage.removeItem('ecoscan_token');
            localStorage.removeItem('ecoscan_user');
            localStorage.removeItem('ecoscan_expires');
            window.location.href = './login.html';
        }

        // Display user info
        function displayUserInfo() {
            const userInfo = document.getElementById('userInfo');
            const userData = localStorage.getItem('ecoscan_user');

            if (userData) {
                const user = JSON.parse(userData);
                userInfo.innerHTML = `
                    <strong>${user.name}</strong>
                    <span>${user.role}</span>
                `;
            }
        }

        // Get status class
        function getStatusClass(status) {
            if (status >= 80) return 'high';
            if (status >= 50) return 'medium';
            return 'low';
        }

        // Format date
        function formatDate(dateStr) {
            if (!dateStr) return '-';
            const date = new Date(dateStr);
            return date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        }

        // Update stats
        function updateStats(bins) {
            const active = bins.filter(b => b.is_active);
            const full = active.filter(b => (b.current_fullness || 0) >= 80).length;
            const filling = active.filter(b => {
                const f = b.current_fullness || 0;
                return f >= 50 && f < 80;
            }).length;
            const available = active.filter(b => (b.current_fullness || 0) < 50).length;

            document.getElementById('totalBins').textContent = active.length;
            document.getElementById('fullBins').textContent = full;
            document.getElementById('fillingBins').textContent = filling;
            document.getElementById('availableBins').textContent = available;
        }

        // Render table
        function renderTable(bins) {
            const content = document.getElementById('tableContent');

            if (bins.length === 0) {
                content.innerHTML = `
                    <div class="empty-state">
                        <p>No bins found. Create your first bin to get started.</p>
                    </div>
                `;
                return;
            }

            // Sort by fullness descending
            bins.sort((a, b) => (b.current_fullness || 0) - (a.current_fullness || 0));

            const rows = bins.map(bin => {
                const status = bin.current_fullness || 0;
                const statusClass = getStatusClass(status);
                const binType = (bin.bin_type || 'general').toLowerCase();

                return `
                    <tr>
                        <td><strong>${bin.name || 'Unnamed'}</strong></td>
                        <td><span class="bin-type ${binType}">${binType}</span></td>
                        <td>${bin.address || '-'}</td>
                        <td>
                            <div class="status-bar ${statusClass}">
                                <div class="bar">
                                    <div class="bar-fill" style="width: ${status}%"></div>
                                </div>
                                <span class="percent">${status}%</span>
                            </div>
                        </td>
                        <td>${bin.reports_count || 0}</td>
                        <td>${formatDate(bin.last_updated)}</td>
                        <td>
                            <span class="active-badge ${bin.is_active ? 'active' : 'inactive'}">
                                ${bin.is_active ? 'Active' : 'Inactive'}
                            </span>
                        </td>
                    </tr>
                `;
            }).join('');

            content.innerHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Type</th>
                            <th>Address</th>
                            <th>Fullness</th>
                            <th>Reports</th>
                            <th>Last Updated</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${rows}
                    </tbody>
                </table>
            `;
        }

        // Load bins
        async function loadBins() {
            const token = checkAuth();
            if (!token) return;

            const refreshBtn = document.getElementById('refreshBtn');
            const content = document.getElementById('tableContent');

            refreshBtn.disabled = true;
            refreshBtn.textContent = 'Loading...';

            try {
                const response = await fetch(`${API_BASE}/admin/bins`, {
                    headers: getAuthHeaders()
                });

                if (response.status === 401) {
                    logout();
                    return;
                }

                if (!response.ok) {
                    throw new Error('Failed to load bins');
                }

                const data = await response.json();
                const bins = data.bins || [];

                updateStats(bins);
                renderTable(bins);

            } catch (err) {
                content.innerHTML = `
                    <div class="error-state">
                        <p>Failed to load bins: ${err.message}</p>
                        <button class="btn-refresh" onclick="loadBins()" style="margin-top: 16px">Try Again</button>
                    </div>
                `;
            } finally {
                refreshBtn.disabled = false;
                refreshBtn.textContent = 'Refresh';
            }
        }

        // Initialize
        checkAuth();
        displayUserInfo();
        loadBins();
    </script>
</body>
</html>
