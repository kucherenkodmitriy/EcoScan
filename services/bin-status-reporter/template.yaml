AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Deployment environment

Resources:
  BinStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "ecoscan-bin-status-${Environment}"
      FunctionTableName: dev-ecoscan-bin-status-reports
      Description: Updates the status of a trash bin in DynamoDB
      CodeUri: target/package/lambda.zip
      Handler: bootstrap
      Runtime: provided.al2
      Architectures:
        - x86_64
      MemorySize: 256
      Timeout: 30
      Environment:
        Variables:
          APP_NAME: ecoscan-bin-status
          ENVIRONMENT: !Ref Environment
          RUST_LOG: info
          # Add other environment variables as needed
      Policies:
        - DynamoDBCrudPolicy:
            TableName: dev-ecoscan-bin-status
      Events:
        HttpApiEvent:
          Type: HttpApi
          Properties:
            Path: /bins/{binId}/status
            Method: POST

  # DynamoDB Table
  TrashBinsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: dev-ecoscan-bin-status
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: bin_id
          AttributeType: S
      KeySchema:
        - AttributeName: bin_id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true

Outputs:
  BinStatusFunctionName:
    Description: Name of the Lambda function
    Value: !Ref BinStatusFunction
  BinStatusFunctionArn:
    Description: ARN of the Lambda function
    Value: !GetAtt BinStatusFunction.Arn
  ApiEndpoint:
    Description: API Gateway endpoint URL for Prod environment
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/"
