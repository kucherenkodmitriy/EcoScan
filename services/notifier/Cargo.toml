[package]
name = "notifier"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "notifier-bootstrap"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
lambda_runtime = { workspace = true }
aws-sdk-dynamodb = { workspace = true }
